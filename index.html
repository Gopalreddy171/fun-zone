ll=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2.5\" y=\"4\" width=\"19\" height=\"13\" rx=\"2\"><\u002Frect><path d=\"M8 21h8M12 17v4\"><\u002Fpath><\u002Fsvg>\n        <span>Web<\u002Fspan>\n      <\u002Fbutton>\n      <button type=\"button\" role=\"tab\" aria-selected=\"{{ mobileSelected }}\" sc-camel-on-click=\"{{ showMobile }}\" class=\"vtab\" style=\"{{ mobileTabStyle }}\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"6\" y=\"2.5\" width=\"12\" height=\"19\" rx=\"2.5\"><\u002Frect><path d=\"M11 18.5h2\"><\u002Fpath><\u002Fsvg>\n        <span>Mobile<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:0;text-align:right;font-size:12.5px;font-weight:700;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ sizeLine }}<\u002Fdiv>\n  <\u002Fheader>\n  <div style=\"{{ stageStyle }}\">\n    <div style=\"{{ webPaneStyle }}\">\n      <div style=\"{{ webScaleStyle }}\">\n        <dc-import name=\"Fun Quiz Zone\" hint-size=\"1362px,100vh\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"{{ mobilePaneStyle }}\">\n      <dc-import name=\"Fun Quiz Zone Mobile Prototype\" hint-size=\"100%,900px\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1362,&quot;height&quot;:820},&quot;startOn&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;web&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;web&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { view: null, vw: 1362, vh: 820 };\n  componentDidMount() {\n    this.onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });\n    this.onResize();\n    window.addEventListener('resize', this.onResize);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }\n  renderVals() {\n    const view = this.state.view || this.props.startOn || 'web';\n    const web = view === 'web';\n    const tab = (on) => 'font-family:inherit;border:0;cursor:pointer;min-height:40px;display:flex;align-items:center;gap:7px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:'\n      + (on ? '900' : '700') + ';color:' + (on ? '#c43e3d' : '#4a5260') + ';background:' + (on ? '#fff' : 'transparent')\n      + ';box-shadow:' + (on ? '0 2px 8px rgba(29,38,54,.10), 0 0 0 1px #f0c9d8' : 'none');\n    return {\n      showWeb: () => this.setState({ view: 'web' }),\n      showMobile: () => this.setState({ view: 'mobile' }),\n      webSelected: web ? 'true' : 'false', mobileSelected: web ? 'false' : 'true',\n      webTabStyle: tab(web), mobileTabStyle: tab(!web),\n      ...(() => {\n        // Fit the whole 1362px desktop screen into the space under the bar: no scrolling either way.\n        const DW = 1362, BAR = 60;\n        const dh = Math.max(this.state.vh, 700);\n        const s = Math.min(1, this.state.vw / DW, (this.state.vh - BAR) / dh);\n        return {\n          stageStyle: 'flex:1;min-height:0;position:relative;overflow-x:hidden;overflow-y:' + (web ? 'hidden' : 'auto'),\n          webPaneStyle: web ? 'display:block;position:relative;overflow:hidden;margin:0 auto;width:' + (DW * s) + 'px;height:' + (dh * s) + 'px' : 'display:none',\n          webScaleStyle: 'width:' + DW + 'px;height:' + dh + 'px;transform:scale(' + s + ');transform-origin:0 0',\n          scalePct: Math.round(s * 100)\n        };\n      })(),\n      mobilePaneStyle: web ? 'display:none' : 'display:block',\n      sizeLine: web ? 'Desktop · 1362 px · fitted to window' : 'Phone · 390 × 844'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
